name: CI

on:
  pull_request:
    # edited reruns the title check after a retitle.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks reads every commit the PR or push adds.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        id: bun
        with:
          bun-version: 1.4.3

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ steps.bun.outputs.bun-version }}-${{ hashFiles('bun.lock', 'apps/bun.lock', 'packages/sdk/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ steps.bun.outputs.bun-version }}-

      - name: Install
        id: install
        run: |
          bun install --frozen-lockfile
          bun install --frozen-lockfile --cwd apps
          # Without its build, so a type error fails the SDK's typecheck, not every check.
          bun install --frozen-lockfile --ignore-scripts --cwd packages/sdk

      # Each check runs even when an earlier one fails, so one run reports them all.
      - name: Format
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run lint

      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: apps
        run: bun run typecheck

      # Format lints the SDK with the rest of the repo.
      - name: Typecheck SDK
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: packages/sdk
        run: bun run typecheck

      - name: Test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: apps
        run: bun run test

      - name: PR title
        if: ${{ !cancelled() && steps.install.outcome == 'success' && github.event_name == 'pull_request' }}
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$TITLE" | bunx commitlint

      - name: Secrets
        if: ${{ !cancelled() }}
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          tarball="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL -o "$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v$VERSION/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "$SHA256  $tarball" | sha256sum -c -
          tar -xzf "$tarball" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --log-opts="$BASE_SHA..$HEAD_SHA" --no-banner --redact --verbose
